<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anagr@Fe</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">

    <header class="topbar">
      <div class="stamp" aria-hidden="true">
        <span>A</span>
        <span id="connection-dot" class="connection-dot offline" aria-hidden="true"></span>
      </div>
      <div class="brand-copy">
        <p class="eyebrow">Ufficio anagrafe</p>
        <h1>Anagr@Fe</h1>
        <p class="tagline">Cerca un cittadino, verifica o calcola il codice fiscale.</p>
      </div>
    </header>

    <section class="search-section">
      <form id="search-form" class="search-form">
        <label class="sr-only" for="search-input">Nome, cognome o codice fiscale</label>
        <input id="search-input" type="search" placeholder="Nome, cognome o codice fiscale" autocomplete="off">
        <button class="primary-button" type="submit">Cerca</button>
      </form>
      <p id="search-message" class="message" role="status">Inserisci almeno due caratteri.</p>

      <div id="results" class="results" aria-live="polite">
        <div class="empty-state" hidden>
          <p class="empty-title">Nessun cittadino trovato in archivio</p>
          <p class="empty-hint">Puoi calcolarlo comunque, senza salvarlo.</p>
          <button id="calc-now-button" class="ghost-button" type="button">Calcola subito il CF</button>
        </div>
      </div>
    </section>

  </main>
  <script src="popup.js"></script>
</body>
</html>
